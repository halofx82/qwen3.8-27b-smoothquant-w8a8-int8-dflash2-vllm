services:
  vllm:
    build:
      context: .
      dockerfile: Dockerfile
    image: local/qwen38-smoothquant-dflash2:vllm-0.28.0
    container_name: qwen38-smoothquant-dflash2
    restart: "no"
    ipc: host
    ports:
      - "8000:8000"
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
      - ./.cache/vllm:/root/.cache/vllm
    environment:
      CUDA_VISIBLE_DEVICES: "0,1,2,3"
      PYTORCH_ALLOC_CONF: expandable_segments:False
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command:
      - serve
      - Freaksterz/Qwen3.8-27B-SmoothQuant-W8A8-INT8
      - --served-model-name
      - freaksterz-qwen38-27b
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --tensor-parallel-size
      - "4"
      - --quantization
      - compressed-tensors
      - --dtype
      - bfloat16
      - --max-model-len
      - "131072"
      - --gpu-memory-utilization
      - "0.90"
      - --max-num-seqs
      - "2"
      - --max-num-batched-tokens
      - "4096"
      - --kv-cache-dtype
      - fp8_e4m3
      - --disable-custom-all-reduce
      - --no-enable-prefix-caching
      - --enable-chunked-prefill
      - --language-model-only
      - --reasoning-parser
      - qwen3
      - --speculative-config
      - '{"method":"dflash","model":"${DRAFT_MODEL:-z-lab/Qwen3.8-27B-DFlash2}","num_speculative_tokens":7}'
